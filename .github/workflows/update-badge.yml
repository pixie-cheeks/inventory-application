name: Update Render Status Badge
on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate Badge & Update README
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          sed -Ez -i "s|(<\!-- RENDER_BADGE_START -->\n).*(\n<\!-- RENDER_BADGE_END -->\n)|\1\![Render Status]($(npx render-status-badge-forked | sed 's/&/\\&/'))\2|" README.md
          git commit -am "[skip render] Update Render status badge" && git push
